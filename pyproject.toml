# ABOUTME: Project + tooling config for the Spec & Design Agent. Managed with uv.
[project]
name = "spec-design-agent"
version = "0.1.0"
description = "Stateless Spec & Design Agent: turns one frozen product intent into a reviewable spec.md, a run record, and a structured result for the Conductor and human Design Review."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed when SPEC_AGENT_PROVIDER=claude.
claude = ["claude-agent-sdk>=0.1.0"]

[project.scripts]
spec-design-agent = "spec_design_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_design_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
